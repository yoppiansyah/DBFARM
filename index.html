<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nadia Nurhaliza Farm's - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            /* Warna Utama */
            --primary: #7c3aed;
            --primary-dark: #5b21b6;
            --secondary: #8b5cf6;
            --bg-color: #f5f3ff;
            --card-bg: #ffffff;
            --text-main: #1e1b4b;
            --text-muted: #64748b;
            --border: #ede9fe;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            /* Fluid Radius & Shadow */
            --radius-lg: clamp(16px, 2vw, 24px);
            --radius-md: clamp(12px, 1.5vw, 16px);
            --radius-sm: 12px;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.03);
            --shadow-lg: 0 15px 30px rgba(109, 40, 217, 0.15);

            /* Fluid Typography */
            --fs-xs: clamp(10px, 0.8vw, 11px);
            --fs-sm: clamp(12px, 1vw, 13px);
            --fs-base: clamp(14px, 1.2vw, 15px);
            --fs-md: clamp(16px, 1.5vw, 18px);
            --fs-lg: clamp(20px, 2.5vw, 24px);
            --fs-xl: clamp(24px, 3vw, 32px);

            /* Fluid Spacing */
            --space-sm: clamp(8px, 1vw, 12px);
            --space-md: clamp(16px, 2vw, 24px);
            --space-lg: clamp(24px, 3vw, 32px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f1f5f9;
                --text-muted: #94a3b8;
                --border: #334155;
            }
            .input-group input, .filter-search-box select, .filter-search-box input[type="date"], .filter-search-box input[type="text"] { 
                background: #334155 !important; 
                color: white !important; 
                border-color: #475569 !important; 
            }
            th { background: #334155 !important; color: #e2e8f0 !important; }
            tr:hover td { background: #334155 !important; }
            td { border-bottom: 1px solid #334155 !important; }
            .slider-item { background: #334155 !important; }
        }

        /* 13. NO HORIZONTAL OVERFLOW */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden; /* Mencegah overflow horizontal di level body */
            font-family: 'Inter', sans-serif;
            font-size: var(--fs-base);
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }
        img { max-width: 100%; height: auto; }

        /* ================= LOGIN PAGE ================= */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-md);
        }
        .login-container { 
            width: 100%; 
            max-width: 420px; 
            background: var(--card-bg); 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-lg); 
            overflow: hidden; 
            border: 1px solid var(--border); 
            animation: slideUp 0.5s ease; 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .login-header { 
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-dark) 100%); 
            color: white; 
            padding: var(--space-lg); 
            text-align: center; 
            position: relative; 
            overflow: hidden; 
        }
        .login-header h1 { font-size: var(--fs-xl); font-weight: 800; margin-bottom: 5px; position: relative; z-index: 1; }
        .login-header p { font-size: var(--fs-sm); opacity: 0.9; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; position: relative; z-index: 1; }
        .login-body { padding: var(--space-lg); }
        
        .form-group { margin-bottom: var(--space-md); width: 100%; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: var(--fs-sm); color: var(--primary); text-transform: uppercase; }
        
        /* 10. BUTTON & TOUCH TARGETS (Min 44px) */
        .input-group { position: relative; width: 100%; }
        .input-group .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--secondary); z-index: 2; }
        .input-group input { 
            width: 100%; 
            padding: 14px 16px 14px 48px; /* Min height > 44px */
            border: 2px solid var(--border); 
            border-radius: var(--radius-sm); 
            font-size: var(--fs-base); 
            background: rgba(124, 58, 237, 0.03); 
            color: var(--text-main); 
            transition: all 0.2s; 
            font-family: inherit; 
        }
        .input-group input:focus { outline: none; border-color: var(--primary); background: var(--card-bg); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1); }
        .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: var(--fs-xs); color: var(--primary); font-weight: 700; padding: 10px; /* Expand touch area */ }
        
        .btn-main { 
            width: 100%; 
            padding: 16px; /* Touch target > 44px */
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-dark) 100%); 
            color: white; 
            border: none; 
            border-radius: var(--radius-sm); 
            font-size: var(--fs-md); 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }
        .btn-main:active { transform: scale(0.98); }

        .alert { padding: 12px; border-radius: var(--radius-sm); margin-bottom: var(--space-md); display: none; font-size: var(--fs-sm); font-weight: 600; text-align: center; }
        .alert.show { display: block; animation: shake 0.4s; }
        .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* ================= 3. APP CONTAINER STRUCTURE ================= */
        .app {
            display: none; /* Dimunculkan via JS setelah login */
            width: 100%;
            min-height: 100vh;
            position: relative;
        }
        
        /* 4. ADAPTIVE SIDEBAR */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.show { opacity: 1; visibility: visible; }
        
        .sidebar-header {
            padding: 24px var(--space-md);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: var(--fs-md);
            font-weight: 800;
            color: var(--primary);
        }
        .sidebar-header i { font-size: 28px; }
        .sidebar-nav {
            padding: var(--space-md) 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }
        .nav-link {
            padding: 14px var(--space-md);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: var(--fs-base);
            transition: 0.2s;
            border-left: 4px solid transparent;
        }
        .nav-link i { font-size: 22px; }
        .nav-link:hover, .nav-link.active {
            background: rgba(124, 58, 237, 0.05);
            color: var(--primary);
            border-left-color: var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Penting untuk fluiditas */
            width: 100%;
            transition: margin-left 0.3s ease;
        }

        /* 5. TOPBAR RESPONSIVE */
        .topbar {
            background: var(--card-bg);
            padding: 12px var(--space-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 900;
            gap: 16px;
        }
        .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }
        .btn-menu {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px; /* Touch target > 40px */
            display: flex;
        }
        .brand-mobile { font-weight: 700; font-size: var(--fs-md); color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 6px 6px;
            background: var(--bg-color);
            border-radius: 50px;
            border: 1px solid var(--border);
        }
        .avatar {
            width: 32px; height: 32px;
            background: var(--primary); color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .username-text { font-size: var(--fs-sm); font-weight: 600; display: none; }

        .content {
            padding: var(--space-md);
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ================= WIDGET & DASHBOARD ELEMENTS ================= */
        .status-bar {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: var(--space-md);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-md);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: var(--shadow-md);
        }
        .status-left { display: flex; align-items: center; gap: clamp(12px, 2vw, 24px); flex-wrap: wrap; font-size: var(--fs-sm); font-weight: 600; }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
        .status-dot.online { background: #34d399; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.2); }
        .status-dot.offline { background: #f87171; }
        .status-dot.checking { background: #fbbf24; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        
        .btn-support {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: var(--fs-sm);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .btn-support:hover { background: rgba(255,255,255,0.3); }

        /* 8. FORM & CONTROLS RESPONSIVE */
        .controls-area {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }
        
        .btn-refresh {
            background: var(--card-bg);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 14px; /* Touch target */
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: var(--fs-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }
        .btn-refresh.spinning i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .filter-search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .filter-search-box select, .filter-search-box input {
            width: 100%;
            padding: 12px; /* Touch target */
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-color);
            font-size: var(--fs-base);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }
        .search-wrapper { position: relative; width: 100%; }
        .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; }
        .search-wrapper input { padding-left: 40px; }

        /* 6. DASHBOARD CARD (CSS Grid) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }
        .stat-card {
            background: var(--card-bg);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-label { font-size: var(--fs-xs); color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .stat-label i { font-size: 16px; }
        .stat-value { font-size: var(--fs-lg); font-weight: 800; line-height: 1.2; }
        .stat-sub { font-size: var(--fs-xs); color: var(--text-muted); font-weight: 600; margin-top: 4px; }

        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: var(--card-bg); padding: var(--space-md); border-radius: var(--radius-lg); margin-bottom: var(--space-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); flex-wrap: wrap; gap: 10px; }
        .card h2 { font-size: var(--fs-md); font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .card-badge { font-size: var(--fs-xs); background: rgba(124, 58, 237, 0.1); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-weight: 700; }

        /* 7. TABLE RESPONSIVE */
        .table-responsive {
            width: 100%;
            overflow-x: auto; /* Kunci untuk tabel di mobile */
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: var(--fs-base); }
        th { background: #f8fafc; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: var(--fs-xs); letter-spacing: 0.5px; padding: 14px 16px; text-align: left; border-bottom: 2px solid var(--border); white-space: nowrap; }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .badge-periode { background: #f3e8ff; color: #6d28d9; padding: 4px 12px; border-radius: 6px; font-size: var(--fs-xs); font-weight: 700; display: inline-block; }

        .slider-track { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
        .slider-track::-webkit-scrollbar { display: none; }
        .slider-item { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; flex-shrink: 0; background: #f1f5f9; display: flex; align-items: center; justify-content: center; }
        .slider-item img { width: 100%; height: 100%; object-fit: cover; }

        /* 9. MODAL RESPONSIVE */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 2000;
            justify-content: center; align-items: center; cursor: zoom-out; padding: var(--space-md);
            backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s;
        }
        .modal.active { display: flex; opacity: 1; }
        .modal-content {
            width: min(95vw, 800px); /* Memenuhi spesifikasi lebar modal fluid */
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            display: flex;
            justify-content: center;
        }
        .modal-content img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            object-fit: contain;
            transform: scale(0.9); transition: transform 0.3s;
        }
        .modal.active .modal-content img { transform: scale(1); }
        .modal-close { position: absolute; top: -10px; right: 0; color: white; font-size: 32px; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); border-radius: 50%; z-index: 2001; }

        .loading-state, .empty-state { text-align: center; padding: 40px var(--space-md); color: var(--text-muted); }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.3; display: block; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }

        /* ================= BREAKPOINTS MOBILE-FIRST ================= */
        
        /* Tablet */
        @media (min-width: 768px) {
            .controls-area { grid-template-columns: auto 1fr; align-items: center; }
            .filter-search-box { flex-direction: row; align-items: center; }
            .filter-search-box select, .filter-search-box input { border: none; border-right: 1px solid var(--border); border-radius: 0; width: auto; flex: 1; }
            .filter-search-box > *:last-child { border-right: none; }
            .btn-refresh { padding: 12px 20px; }
            .username-text { display: inline; }
        }

        /* Laptop / Desktop (Sidebar permanen) */
        @media (min-width: 992px) {
            .btn-menu { display: none; }
            .brand-mobile { display: none; }
            .sidebar { transform: translateX(0); position: sticky; /* Sticky untuk fluiditas container parent */ }
            .sidebar-overlay { display: none !important; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="login-page" id="loginPage">
    <div class="login-container">
        <div class="login-header">
            <h1>Nadia Farm's</h1>
            <p>Smart Poultry Manager</p>
        </div>
        <div class="login-body">
            <div id="alert" class="alert"></div>
            <form onsubmit="handleLogin(event)" autocomplete="off">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-group">
                        <span class="icon"><i class="ph ph-user"></i></span>
                        <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <span class="icon"><i class="ph ph-lock-key"></i></span>
                        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="off">
                        <span class="password-toggle" onclick="togglePassword()">LIHAT</span>
                    </div>
                </div>
                <button type="submit" class="btn-main"><i class="ph ph-sign-in"></i> Masuk Dashboard</button>
            </form>
        </div>
    </div>
</div>

<div class="app" id="dashboardPage">
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="ph ph-plant"></i> Nadia Farm's
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-link active" onclick="switchTab('pakan', this)"><i class="ph ph-bowl-food"></i> Riwayat Pakan</a>
            <a href="#" class="nav-link" onclick="switchTab('daily', this)"><i class="ph ph-chart-bar"></i> Laporan Harian</a>
        </nav>
        <div style="padding: var(--space-md); border-top: 1px solid var(--border);">
            <a href="#" class="nav-link" style="color: var(--danger);" onclick="logout()"><i class="ph ph-sign-out"></i> Keluar</a>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
        
        <header class="topbar">
            <div class="topbar-left">
                <button class="btn-menu" onclick="toggleSidebar()"><i class="ph ph-list"></i></button>
                <div class="brand-mobile"><i class="ph ph-plant"></i> Nadia Farm's</div>
            </div>
            <div class="topbar-right">
                <div class="user-profile">
                    <div class="avatar"><i class="ph ph-user"></i></div>
                    <span class="username-text" id="displayUsername">Admin</span>
                </div>
            </div>
        </header>

        <section class="content">
            
            <div class="status-bar">
                <div class="status-left">
                    <div class="status-item">
                        <span class="status-dot checking" id="statusDot"></span>
                        <span id="statusText">Memeriksa...</span>
                    </div>
                    <div class="status-item">
                        <i class="ph ph-calendar"></i>
                        <span id="liveClock">-</span>
                    </div>
                </div>
                <a class="btn-support" id="waSupport" href="#" target="_blank" rel="noopener">
                    <i class="ph ph-whatsapp-logo"></i> Hubungi Dukungan
                </a>
            </div>

            <div class="controls-area">
                <button class="btn-refresh" id="refreshBtn" onclick="loadDashboard()">
                    <i class="ph ph-arrows-clockwise"></i> <span class="hide-mobile">Refresh</span>
                </button>
                
                <div class="filter-search-box">
                    <select id="filterPeriode" onchange="handlePeriodeChange()">
                        <option value="">-- Semua Periode --</option>
                    </select>

                    <select id="filterWaktu" onchange="handleWaktuChange()" style="display: none;">
                        <option value="semua">Semua Waktu</option>
                        <option value="hari_ini">Hari Ini</option>
                        <option value="bulan_ini">Bulan Ini</option>
                        <option value="tahun_ini">Tahun Ini</option>
                        <option value="custom">Pilih Tanggal...</option>
                    </select>

                    <input type="date" id="filterTanggal" style="display: none;" onchange="filterTable()">
                    
                    <div class="search-wrapper">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="globalSearch" placeholder="Cari data..." oninput="filterTable()">
                    </div>
                </div>
            </div>

            <div class="stats-grid" id="statsContainer"></div>

            <div id="tab-pakan" class="tab-content active">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="ph ph-bowl-food" style="color:var(--primary);"></i> Data Pakan Masuk</h2>
                        <span class="card-badge" id="pakanCount">0 Data</span>
                    </div>
                    <div id="pakanContent">
                        <div class="loading-state"><div class="spinner"></div><div>Memuat data...</div></div>
                    </div>
                </div>
            </div>

            <div id="tab-daily" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="ph ph-chart-bar" style="color:var(--primary);"></i> Laporan Harian & Pertumbuhan</h2>
                        <span class="card-badge" id="dailyCount">0 Data</span>
                    </div>
                    <div id="dailyContent">
                        <div class="loading-state"><div class="spinner"></div><div>Memuat data...</div></div>
                    </div>
                </div>
            </div>

        </section>
    </main>
</div>

<div class="modal" id="fotoModal" onclick="closeModal(event)">
    <div class="modal-content">
        <div class="modal-close" onclick="closeModal(event)"><i class="ph ph-x"></i></div>
        <img id="modalImage" src="" alt="Foto Detail">
    </div>
</div>

<script>
    // --- KONFIGURASI ---
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIkN3OGzhRT25_dYSGX4RDW5hIZxuN7d-kATz6Rc1OUGbIa6D9-i8SYD1dNX--vQ/exec';
    const VALID_USERNAME = 'admin';
    const VALID_PASSWORD = 'ayamberkah12';

    let globalPakanData = [];
    let globalDailyData = [];
    let globalPeriodeList = [];
    let globalPakanInfo = null;
    let globalPerformaInfo = null; // Tambahan variabel untuk menyimpan FCR & IP
    let isLoading = false;

    // --- FUNGSI UI KHUSUS ---
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('show');
    }

    function togglePassword() {
        const input = document.getElementById('password');
        const toggle = document.querySelector('.password-toggle');
        if (input.type === 'password') {
            input.type = 'text';
            toggle.textContent = 'SEMBUNYI';
        } else {
            input.type = 'password';
            toggle.textContent = 'LIHAT';
        }
    }

    function switchTab(tabName, element) {
        // Hapus kelas aktif di sidebar
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        if(element) element.classList.add('active');
        
        // Sembunyikan konten
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        
        // Tutup sidebar jika di mobile
        if(window.innerWidth < 992) toggleSidebar();
        
        filterTable();
    }

    function openModal(url) {
        if (!url || !url.startsWith('http')) return;
        document.getElementById('modalImage').src = url;
        document.getElementById('fotoModal').classList.add('active');
        document.body.style.overflow = 'hidden'; // Kunci scroll background
    }

    function closeModal(e) {
        if (e && e.target !== e.currentTarget && e.target.tagName !== 'IMG' && !e.target.closest('.modal-close')) return;
        document.getElementById('fotoModal').classList.remove('active');
        document.body.style.overflow = ''; 
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(e); });

    // --- FUNGSI OTENTIKASI ---
    function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;

        if (u === VALID_USERNAME && p === VALID_PASSWORD) {
            const sessionData = { username: u, time: new Date().toISOString() };
            localStorage.setItem('nadz_session', JSON.stringify(sessionData));
            showDashboard(u);
        } else {
            const alert = document.getElementById('alert');
            alert.className = 'alert show error';
            alert.textContent = 'Username atau password salah!';
            setTimeout(() => alert.classList.remove('show'), 3000);
        }
    }

    function showDashboard(username) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'flex'; // Pakai flex untuk app container
        document.getElementById('displayUsername').textContent = username;
        document.getElementById('waSupport').href = 'https://wa.me/6282289467410?text=Halo%20Admin%20Nadia%20Farm%27s%2C%20saya%20butuh%20bantuan.';

        loadFilterPeriode();
        loadDashboard();
        updateClock();
        setInterval(updateClock, 60000);
    }

    function logout() {
        localStorage.removeItem('nadz_session');
        location.reload();
    }

    function checkSession() {
        const session = localStorage.getItem('nadz_session');
        if (session) {
            try {
                const data = JSON.parse(session);
                const diffHours = (new Date() - new Date(data.time)) / (1000 * 60 * 60);
                if (diffHours < 168) showDashboard(data.username);
            } catch (e) { console.warn('Session invalid:', e); }
        }
    }

    // --- FUNGSI UTILITAS DATA ---
    function setConnectionStatus(state) {
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        dot.className = 'status-dot ' + state;
        if (state === 'online') text.textContent = 'Terhubung';
        else if (state === 'offline') text.textContent = 'Offline';
        else text.textContent = 'Memuat...';
    }

    function updateClock() {
        const now = new Date();
        const options = { weekday: 'long', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
        document.getElementById('liveClock').textContent = now.toLocaleDateString('id-ID', options) + ' WIB';
    }

    function parseKgDashboard(kgValue) {
        if (!kgValue) return 0;
        if (typeof kgValue === 'string') {
            kgValue = kgValue.replace(/\./g, '');
            kgValue = kgValue.replace(/,/g, '.');
        }
        return parseFloat(kgValue) || 0;
    }

    // --- FUNGSI API FETCHING ---
    async function loadFilterPeriode() {
        try {
            const res = await fetch(SCRIPT_URL + '?action=getPeriode');
            if (!res.ok) throw new Error('Gagal koneksi server');
            const result = await res.json();

            if (result.status === 'success' && Array.isArray(result.data)) {
                globalPeriodeList = result.data;
                const select = document.getElementById('filterPeriode');
                const currentValue = select.value;
                select.innerHTML = '<option value="">-- Semua Periode --</option>';

                result.data.forEach(p => {
                    if (p.id_periode === "Belum Ada") return;
                    const opt = document.createElement('option');
                    opt.value = p.id_periode;
                    opt.textContent = p.populasi ? `${p.id_periode} | Populasi: ${p.populasi.populasi_sekarang} ekor` : p.display_name || p.id_periode;
                    select.appendChild(opt);
                });

                if (currentValue) {
                    select.value = currentValue;
                    document.getElementById('filterWaktu').style.display = '';
                }
            }
        } catch (e) { console.warn('Gagal load periode:', e); }
    }

    function handlePeriodeChange() {
        const periode = document.getElementById('filterPeriode').value;
        const filterWaktu = document.getElementById('filterWaktu');
        const inputTanggal = document.getElementById('filterTanggal');

        if (periode !== "") {
            filterWaktu.style.display = '';
        } else {
            filterWaktu.style.display = 'none'; filterWaktu.value = 'semua';
            inputTanggal.style.display = 'none'; inputTanggal.value = '';
        }
        loadDashboard();
    }

    function handleWaktuChange() {
        const filterWaktu = document.getElementById('filterWaktu').value;
        const inputTanggal = document.getElementById('filterTanggal');
        inputTanggal.style.display = filterWaktu === 'custom' ? '' : 'none';
        if(filterWaktu !== 'custom') inputTanggal.value = '';
        filterTable();
    }

    async function loadDashboard() {
        if (isLoading) return;
        isLoading = true;

        const periode = document.getElementById('filterPeriode').value;
        let url = SCRIPT_URL + '?action=getAll';
        if (periode) url += '&periode=' + encodeURIComponent(periode);

        const btn = document.getElementById('refreshBtn');
        btn.classList.add('spinning');
        setConnectionStatus('checking');

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Respon tidak ok');
            const result = await res.json();

            if (result.status === 'success' && Array.isArray(result.data)) {
                globalPakanData = result.data.filter(i => i.sheet === 'Pakan');
                globalDailyData = result.data.filter(i => i.sheet === 'Daily');

                // PERUBAHAN: Memanggil Data Pakan & Data Performa Aktual
                if (periode) {
                    await loadPakanInfo(periode);
                    await loadPerformaInfo(periode);
                } else { 
                    globalPakanInfo = null; 
                    globalPerformaInfo = null;
                }

                renderStats();
                filterTable();
                setConnectionStatus('online');
            } else { throw new Error('Data format salah'); }
        } catch (e) {
            console.error('Error:', e);
            setConnectionStatus('offline');
            document.getElementById('pakanContent').innerHTML = '<div class="empty-state"><i class="ph ph-wifi-slash"></i><p>Gagal memuat data.</p></div>';
            document.getElementById('dailyContent').innerHTML = '<div class="empty-state"><i class="ph ph-wifi-slash"></i><p>Gagal memuat data.</p></div>';
        } finally {
            btn.classList.remove('spinning');
            isLoading = false;
        }
    }

    async function loadPakanInfo(periode) {
        try {
            const res = await fetch(SCRIPT_URL + '?action=getPakanInfo&periode=' + encodeURIComponent(periode));
            const result = await res.json();
            if (result.status === 'success') globalPakanInfo = result.data;
        } catch (e) { console.warn('Gagal load pakan info:', e); }
    }

    // FUNGSI BARU: Load data FCR dan IP Aktual
    async function loadPerformaInfo(periode) {
        try {
            const res = await fetch(SCRIPT_URL + '?action=getPerforma&periode=' + encodeURIComponent(periode));
            const result = await res.json();
            if (result.status === 'success') globalPerformaInfo = result.data;
        } catch (e) { console.warn('Gagal load performa info:', e); }
    }

    // --- FUNGSI RENDER DASHBOARD ---
    function renderStats() {
        const totalKg = globalPakanData.reduce((acc, curr) => acc + parseKgDashboard(curr.jumlah_kg), 0);
        let totalMati = 0, populasiAwal = 0, populasiSekarang = 0, mortalitas = 0;
        const selectedPeriode = document.getElementById('filterPeriode').value;
        
        if (selectedPeriode) {
            const periodeData = globalPeriodeList.find(p => p.id_periode === selectedPeriode);
            if (periodeData && periodeData.populasi) {
                totalMati = parseInt(periodeData.populasi.total_mati) || 0;
                populasiAwal = parseInt(periodeData.populasi.jumlah_awal) || 0;
                populasiSekarang = parseInt(periodeData.populasi.populasi_sekarang) || 0;
                mortalitas = periodeData.populasi.persentase_mati || 0;
            }
        } else {
            globalPeriodeList.forEach(p => { if (p.populasi) totalMati += parseInt(p.populasi.total_mati) || 0; });
        }

        let statsHTML = `
            <div class="stat-card">
                <div class="stat-label"><i class="ph ph-scales"></i> Total Pakan Masuk</div>
                <div class="stat-value" style="color: var(--primary);">${totalKg.toLocaleString('id-ID')} Kg</div>
                <div class="stat-sub">Akumulasi periode terpilih</div>
            </div>`;

        if (selectedPeriode && globalPakanInfo) {
            statsHTML += `
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-package"></i> Total Pakan Tersisa</div>
                    <div class="stat-value" style="color: var(--info);">${globalPakanInfo.sisa_zak} Zak</div>
                    <div class="stat-sub">${globalPakanInfo.sisa_kg.toLocaleString('id-ID')} Kg</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-check-circle"></i> Total Pakan Terpakai</div>
                    <div class="stat-value" style="color: var(--warning);">${globalPakanInfo.total_terpakai_zak} Zak</div>
                    <div class="stat-sub">${globalPakanInfo.total_terpakai_kg.toLocaleString('id-ID')} Kg</div>
                </div>`;
        }

        statsHTML += `
            <div class="stat-card">
                <div class="stat-label"><i class="ph ph-warning-circle"></i> Total Kematian</div>
                <div class="stat-value" style="color: var(--danger);">${totalMati.toLocaleString('id-ID')} Ekor</div>
                <div class="stat-sub">Akumulasi periode terpilih</div>
            </div>`;

        if (selectedPeriode && populasiAwal > 0) {
            statsHTML += `
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-bird"></i> Populasi Awal</div>
                    <div class="stat-value">${populasiAwal.toLocaleString('id-ID')}</div>
                    <div class="stat-sub">Ekor</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-trend-up"></i> Populasi Saat Ini</div>
                    <div class="stat-value" style="color: var(--success);">${populasiSekarang.toLocaleString('id-ID')}</div>
                    <div class="stat-sub">Ekor (Mortalitas: ${mortalitas}%)</div>
                </div>`;
        }

        // PERUBAHAN: Menambahkan Card FCR Aktual dan IP Aktual
        if (selectedPeriode && globalPerformaInfo) {
            statsHTML += `
                <div class="stat-card" style="border-left: 4px solid var(--primary);">
                    <div class="stat-label"><i class="ph ph-chart-line-up"></i> Indeks Performa (IP)</div>
                    <div class="stat-value" style="color: var(--primary); font-size: var(--fs-xl);">${globalPerformaInfo.ip_aktual}</div>
                    <div class="stat-sub">Target standar PT: > 300</div>
                </div>
                <div class="stat-card" style="border-left: 4px solid var(--warning);">
                    <div class="stat-label"><i class="ph ph-scales"></i> FCR Aktual</div>
                    <div class="stat-value" style="color: var(--warning); font-size: var(--fs-xl);">${globalPerformaInfo.fcr_aktual}</div>
                    <div class="stat-sub">Rata-rata berat: ${globalPerformaInfo.rata_rata_berat_kg} Kg/Ekor</div>
                </div>`;
        }

        document.getElementById('statsContainer').innerHTML = statsHTML;
    }

    function filterTable() {
        const query = document.getElementById('globalSearch').value.toLowerCase().trim();
        const waktu = document.getElementById('filterWaktu').value;
        const tanggalCustom = document.getElementById('filterTanggal').value;
        const selectedPeriode = document.getElementById('filterPeriode').value;
        
        const today = new Date();
        const curYearStr = String(today.getFullYear());
        const curMonthStr = String(today.getMonth() + 1).padStart(2, '0');
        const curDayStr = String(today.getDate()).padStart(2, '0');
        
        const todayStr = `${curYearStr}-${curMonthStr}-${curDayStr}`;
        const thisMonthStr = `${curYearStr}-${curMonthStr}`;

        const isDateMatch = (itemDateStr) => {
            if (waktu === 'semua' || selectedPeriode === "") return true;
            if (!itemDateStr) return false;
            
            if (waktu === 'hari_ini') return itemDateStr === todayStr;
            if (waktu === 'bulan_ini') return itemDateStr.startsWith(thisMonthStr);
            if (waktu === 'tahun_ini') return itemDateStr.startsWith(curYearStr);
            if (waktu === 'custom' && tanggalCustom) return itemDateStr === tanggalCustom;
            return true;
        };

        const fPakan = globalPakanData.filter(item => isDateMatch(item.tanggal) && Object.values(item).some(val => String(val).toLowerCase().includes(query)));
        const fDaily = globalDailyData.filter(item => isDateMatch(item.tanggal) && Object.values(item).some(val => String(val).toLowerCase().includes(query)));

        renderPakanTable(fPakan);
        renderDailyTable(fDaily);

        document.getElementById('pakanCount').textContent = fPakan.length + ' Data';
        document.getElementById('dailyCount').textContent = fDaily.length + ' Data';
    }

    function renderPakanTable(data) {
        const container = document.getElementById('pakanContent');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="ph ph-tray"></i><p>Tidak ada data ditemukan</p></div>'; return;
        }

        let html = `<div class="table-responsive"><table><thead><tr>
            <th>Tanggal</th><th>Periode</th><th>Sumber</th><th>PO</th><th>Zak</th><th>Kg</th><th>Kendaraan</th><th>Dokumentasi</th>
        </tr></thead><tbody>`;
        data.forEach(item => {
            const kg = parseKgDashboard(item.jumlah_kg);
            html += `<tr>
                <td><strong>${item.tanggal || '-'}</strong></td>
                <td><span class="badge-periode">${item.id_periode || '-'}</span></td>
                <td>${item.sumber_pakan || '-'}</td>
                <td>${item.no_po || '-'}</td>
                <td>${item.jumlah_zak || '0'}</td>
                <td style="font-weight:700; color:var(--primary);">${kg.toLocaleString('id-ID')} Kg</td>
                <td>${item.kendaraan || '-'}</td>
                <td>${createFotoSlider(item.dokumentasi)}</td>
            </tr>`;
        });
        container.innerHTML = html + '</tbody></table></div>';
    }

    function renderDailyTable(data) {
        const container = document.getElementById('dailyContent');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="ph ph-clipboard-text"></i><p>Tidak ada data ditemukan</p></div>'; return;
        }

        let html = `<div class="table-responsive"><table><thead><tr>
            <th>Tanggal</th><th>Usia</th><th>ABW 1</th><th>Foto</th><th>ABW 2</th><th>Foto</th>
            <th>ABW 3</th><th>Foto</th><th>ABW 4</th><th>Foto</th><th>Mati</th><th>Foto Kematian</th>
        </tr></thead><tbody>`;
        data.forEach(item => {
            const mati = parseInt(item.jumlah_mati) || 0;
            const usia = item.usia || item.umur_hari || '0';
            html += `<tr>
                <td><strong>${item.tanggal || '-'}</strong></td>
                <td>${usia} Hari</td>
                <td>${formatABW(item.abw_sekat1)}</td><td>${createFotoSlider(item.foto_sekat1)}</td>
                <td>${formatABW(item.abw_sekat2)}</td><td>${createFotoSlider(item.foto_sekat2)}</td>
                <td>${formatABW(item.abw_sekat3)}</td><td>${createFotoSlider(item.foto_sekat3)}</td>
                <td>${formatABW(item.abw_sekat4)}</td><td>${createFotoSlider(item.foto_sekat4)}</td>
                <td style="color:${mati > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">${mati}</td>
                <td>${createFotoSlider(item.foto_kematian)}</td>
            </tr>`;
        });
        container.innerHTML = html + '</tbody></table></div>';
    }

    // PERUBAHAN: Konversi nilai ABW (Kg/10 ekor) menjadi gram per ekor
    function formatABW(value) {
        if (!value || value === "" || value === "0" || value === 0) return "-";
        if (typeof value === 'string' && value.match(/^\d{2}\/\d{2}\/\d{4}$/)) return "-";
        
        // Konversi dari Kg per 10 Ekor menjadi Gram per 1 Ekor
        // Contoh: Input 3.2 Kg -> dibagi 10 = 0.32 Kg -> dikali 1000 = 320 gram
        let gramPerEkor = (parseFloat(value) / 10) * 1000;
        
        return gramPerEkor.toFixed(0) + " g";
    }

    function createFotoSlider(str) {
        if (!str || typeof str !== 'string' || str.includes("Tidak ada") || str === "-") return '<span style="color:var(--text-muted);font-size:12px;">-</span>';
        const urls = str.split(/[,\n]/).map(u => u.trim()).filter(u => u.startsWith('http'));
        if (urls.length === 0) return '<span style="color:var(--text-muted);font-size:12px;">-</span>';

        let html = `<div class="slider-track">`;
        urls.forEach(url => {
            html += `<div class="slider-item" onclick="openModal('${url}')">
                <img src="${url}" loading="lazy" alt="Foto">
            </div>`;
        });
        return html + `</div>`;
    }

    // --- INISIALISASI ---
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); document.querySelector('.btn-main').click(); }
        });
        checkSession();
    });

    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'r') {
            e.preventDefault();
            if (document.getElementById('dashboardPage').style.display !== 'none') loadDashboard();
        }
    });
</script>
</body>
</html>
