// =================================================================
// FUNGSI: Konversi URL Google Drive ke Thumbnail
// =================================================================
function convertDriveUrlToThumbnail(url) {
  if (!url || url === "Tidak ada dokumentasi") return "";
  
  var urls = url.split(',').map(function(u) { return u.trim(); });
  var thumbnails = [];
  
  urls.forEach(function(u) {
    if (u.indexOf('drive.google.com') > -1) {
      var fileId = '';
      var match = u.match(/\/d\/([^\/]+)/);
      if (match) {
        fileId = match[1];
      } else {
        match = u.match(/id=([^&]+)/);
        if (match) fileId = match[1];
      }
      
      if (fileId) {
        thumbnails.push('https://drive.google.com/thumbnail?id=' + fileId + '&sz=w500');
      } else {
        thumbnails.push(u);
      }
    } else {
      thumbnails.push(u);
    }
  });
  
  return thumbnails.join(',');
}

// =================================================================
// FUNGSI: Mendapatkan Info Periode
// =================================================================
function getPeriodeInfo(idPeriode) {
  var doc = SpreadsheetApp.getActiveSpreadsheet();
  var sheetPeriode = doc.getSheetByName("Master Periode");
  if (!sheetPeriode) { setupDatabase(); sheetPeriode = doc.getSheetByName("Master Periode"); }
  
  var data = sheetPeriode.getDataRange().getValues();
  for (var i = 1; i < data.length; i++) {
    if (data[i][0] === idPeriode) {
      return {
        id_periode: data[i][0],
        nama_periode: data[i][1] || data[i][0],
        tanggal_masuk: data[i][2],
        estimasi_panen: data[i][3],
        status: data[i][4] || "Aktif",
        jumlah_bibit: data[i][5] || "",
        jenis_bibit: data[i][6] || "DOC Broiler",
        catatan: data[i][7] || ""
      };
    }
  }
  return null;
}

// =================================================================
// FUNGSI: Menghitung Umur Ayam
// =================================================================
function hitungUmurAyam(idPeriode, tanggalLaporan) {
  var infoPeriode = getPeriodeInfo(idPeriode);
  if (!infoPeriode || !infoPeriode.tanggal_masuk) return null;
  
  var tglMasuk = new Date(infoPeriode.tanggal_masuk);
  var tglLaporan = new Date(tanggalLaporan);
  var selisihHari = Math.floor((tglLaporan - tglMasuk) / (1000 * 60 * 60 * 24));
  var umur = selisihHari + 1;
  return umur > 0 ? umur : 0;
}

// =================================================================
// FUNGSI: Mendapatkan Semua Periode
// =================================================================
function getAllPeriode() {
  var doc = SpreadsheetApp.getActiveSpreadsheet();
  var sheetPeriode = doc.getSheetByName("Master Periode");
  if (!sheetPeriode) { setupDatabase(); sheetPeriode = doc.getSheetByName("Master Periode"); }
  
  var lastRow = sheetPeriode.getLastRow();
  if (lastRow <= 1) {
    return [{ id_periode: "Belum Ada", nama_periode: "Belum Ada Periode", tanggal_masuk: "", estimasi_panen: "", status: "Kosong", display_name: "Belum Ada Periode" }];
  }
  
  var data = sheetPeriode.getRange(2, 1, lastRow - 1, 8).getValues();
  var periodeList = [];
  
  for (var i = 0; i < data.length; i++) {
    if (data[i][0]) {
      var tanggalMasuk = data[i][2] ? formatDate(data[i][2]) : "";
      var estimasiPanen = data[i][3] ? formatDate(data[i][3]) : "";
      periodeList.push({
        id_periode: data[i][0],
        nama_periode: data[i][1] || data[i][0],
        tanggal_masuk: tanggalMasuk,
        estimasi_panen: estimasiPanen,
        status: data[i][4] || "Aktif",
        jumlah_bibit: data[i][5] || "",
        jenis_bibit: data[i][6] || "DOC Broiler",
        catatan: data[i][7] || "",
        display_name: data[i][0] + " (Masuk: " + tanggalMasuk + ")"
      });
    }
  }
  
  periodeList.sort(function(a, b) { return new Date(b.tanggal_masuk) - new Date(a.tanggal_masuk); });
  return periodeList;
}

// =================================================================
// FUNGSI: Menambah Periode Baru

function addNewPeriode(data) {
  var doc = SpreadsheetApp.getActiveSpreadsheet();
  var sheetPeriode = doc.getSheetByName("Master Periode");
  if (!sheetPeriode) { setupDatabase(); sheetPeriode = doc.getSheetByName("Master Periode"); }
  
  if (!data.id_periode || !data.tanggal_masuk) throw new Error("ID Periode dan Tanggal Bibit Masuk wajib diisi!");
  
  var existingData = sheetPeriode.getDataRange().getValues();
  for (var i = 1; i < existingData.length; i++) {
    if (existingData[i][0] === data.id_periode) throw new Error("ID Periode sudah ada!");
  }
  
  var tglMasuk = new Date(data.tanggal_masuk);
  var tglPanen = new Date(tglMasuk);
  tglPanen.setDate(tglPanen.getDate() + (data.estimasi_hari || 60));
  
  sheetPeriode.appendRow([data.id_periode, data.nama_periode || data.id_periode, data.tanggal_masuk, 
                          formatDate(tglPanen), "Aktif", data.jumlah_bibit || "", data.jenis_bibit || "DOC Broiler", data.catatan || "Periode baru"]);
  
  return { status: "success", message: "Periode baru berhasil ditambahkan!" };
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  var hasLock = lock.tryLock(15000);
  if (!hasLock) return ContentService.createTextOutput(JSON.stringify({status: "error", error: "Server sibuk"})).setMimeType(ContentService.MimeType.JSON);

  try {
    ensureDatabaseExists();
    var contents = JSON.parse(e.postData.contents);

    if (contents.update_id !== undefined) {
      if (contents.message && contents.message.text) handleTelegramCommand(contents.message);
      return ContentService.createTextOutput(JSON.stringify({status: "success"})).setMimeType(ContentService.MimeType.JSON);
    }

    if (contents.action === "addPeriode") {
      var result = addNewPeriode(contents.data);
      return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
    }

    if (VALID_SHEETS.indexOf(contents.sheetName) === -1) throw new Error("Sheet tidak dikenali");
    
    processWebForm(contents);
    return ContentService.createTextOutput(JSON.stringify({status: "success"})).setMimeType(ContentService.MimeType.JSON);

  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({status: "error", error: err.toString()})).setMimeType(ContentService.MimeType.JSON);
  } finally {
    lock.releaseLock();
  }
}

              if (matchMati) {
                var jml = parseInt(matchMati[1]);
                totalMati += jml;
                var pelapor = (row[j].toString().match(/Pelapor:\s*([^\n]+)/) || [])[1] || "Staff";
                jamInfo.push("Jam " + (j - 2) + " (" + pelapor + ") : " + jml + " ekor");
              }
              var matchFoto = row[j].toString().match(/Foto:\s*(.+)$/);
              if (matchFoto) fotoMati.push(matchFoto[1]);
            }
          }
          matiMap[key] = { id_periode: id_periode, jumlah_mati: totalMati, jam: jamInfo.join("; "), foto: fotoMati.join(',') };
        }
      }
    }

    // Proses data daily
    var sheetDaily = doc.getSheetByName("Report Daily");
    if (sheetDaily) {
      var lastRowDaily = sheetDaily.getLastRow();
      if (lastRowDaily > 1) {
        var dailyData = sheetDaily.getRange(2, 1, lastRowDaily - 1, 14).getValues();
        for (var i = 0; i < dailyData.length; i++) {
          var row = dailyData[i];
          if (!row[2]) continue;
          
          var id_periode = row[1] || "";
          if (filterPeriode && id_periode !== filterPeriode) continue;
          
          var tgl = formatDate(row[2]);
          var key = id_periode + "_" + tgl;
          var m = matiMap[key] || { jumlah_mati: 0, jam: "", foto: "" };
          
          allData.push({
            sheet: "Daily",
            id_periode: id_periode,
            tanggal: tgl,
            umur_hari: row[3] || "",
            pakan_atas: row[4] || "",
            pakan_bawah: row[5] || "",
            abw_sekat1: row[6] || "",
            foto_sekat1: convertDriveUrlToThumbnail(row[7]),
            abw_sekat2: row[8] || "",
            foto_sekat2: convertDriveUrlToThumbnail(row[9]),
            abw_sekat3: row[10] || "",
            foto_sekat3: convertDriveUrlToThumbnail(row[11]),
            abw_sekat4: row[12] || "",
            foto_sekat4: convertDriveUrlToThumbnail(row[13]),
            jumlah_mati: m.jumlah_mati,
            jam: m.jam,
            foto_kematian: convertDriveUrlToThumbnail(m.foto)
          });
        }
      }
    }
    
    // Proses data pakan
    var sheetPakan = doc.getSheetByName("Report Pakan");
    if (sheetPakan) {
      var lastRowPakan = sheetPakan.getLastRow();
      if (lastRowPakan > 1) {
        var pakanData = sheetPakan.getRange(2, 1, lastRowPakan - 1, 10).getValues();
        for (var i = 0; i < pakanData.length; i++) {
          var row = pakanData[i];
          if (!row[2]) continue;
          
          var id_periode = row[1] || "";
          if (filterPeriode && id_periode !== filterPeriode) continue;
          
          allData.push({
            sheet: "Pakan",
            id_periode: id_periode,
            tanggal: formatDate(row[2]),
            sumber_pakan: row[3] || "",
            no_po: row[4] || "",
            jumlah_zak: row[5] || "",
            jumlah_kg: row[6] || "",
            kendaraan: row[7] || "",
            deskripsi: row[8] || "",
            dokumentasi: convertDriveUrlToThumbnail(row[9])
          });
        }
      }
    }
    
    return ContentService.createTextOutput(JSON.stringify({ status: "success", data: allData })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}

function processWebForm(data) {
  var doc = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = doc.getSheetByName(data.sheetName);
  if (!sheet) { sheet = doc.insertSheet(data.sheetName); buatHeaderOtomatis(sheet, data.sheetName); }
  else { ensureHeaderExists(sheet, data.sheetName); }

  var ts = new Date();
  var periode = data.id_periode || "Tidak Ada Periode";

  if (data.sheetName === "Report Pakan") {
    var urls = processPhotos(data.fotoList, "Eviden_Pakan");
    sheet.appendRow([ts, periode, data.tanggal, data.sumber_pakan, data.no_po_atau_asal, 
                     data.jumlah_zak, data.jumlah_kg, data.kendaraan, data.deskripsi, urls]);

                   `📸 *Dokumentasi:* ${urls}`;
    sendTelegramMessageMarkdown(msgPakan);
  }
  else if (data.sheetName === "Report Kematian") {
    var urls = processPhotos(data.fotoList, "Eviden_Kematian");
    var range = sheet.getDataRange().getValues();
    var idx = -1;
    
    for (var i = 1; i < range.length; i++) { 
      if (formatDate(range[i][2]) === formatDate(data.tanggal) && range[i][1] === periode) { idx = i + 1; break; } 
    }
    
    if (idx === -1) { sheet.appendRow([ts, periode, data.tanggal]); idx = sheet.getLastRow(); }
    
    var colJam = 3 + Number(data.jam);
    sheet.getRange(idx, colJam).setValue(`Jam: ${data.jam} (Pelapor: ${data.pelapor})\nMati: ${data.jumlah_mati} ekor\nFoto: ${urls}`);
    
    var msgMati = `⚠️ *LAPORAN KEMATIAN*\nNadz Farm | ${periode}\n\n` +
                  `📅 Tanggal: ${data.tanggal}\n⏰ Jam ke-: ${data.jam}\n` +
                  `👤 Pelapor: ${data.pelapor}\n💀 Jumlah: *${data.jumlah_mati} Ekor*\n📸 *Foto:* ${urls}`;
    sendTelegramMessageMarkdown(msgMati);
  }
  else if (data.sheetName === "Report Daily") {
    var umurOtomatis = hitungUmurAyam(periode, data.tanggal);
    var umurFinal = data.umur_hari || umurOtomatis || 0;
    
    var u1 = processPhotos(data.fotoList1, "Sekat1");
    var u2 = processPhotos(data.fotoList2, "Sekat2");
    var u3 = processPhotos(data.fotoList3, "Sekat3");
    var u4 = processPhotos(data.fotoList4, "Sekat4");
    
    sheet.appendRow([ts, periode, data.tanggal, umurFinal, data.pakan_atas, data.pakan_bawah, 
                     data.abw_sekat1, u1, data.abw_sekat2, u2, data.abw_sekat3, u3, data.abw_sekat4, u4]);
    
    updateRekapLaporanFull();
    sendMasterDailyReportToTelegram(data.tanggal, periode, umurFinal);
  }
}

function ensureDatabaseExists() {
  var doc = SpreadsheetApp.getActiveSpreadsheet();
  var sheets = doc.getSheets();
  var sheetNames = sheets.map(function(s) { return s.getName(); });
  var requiredSheets = ["Report Pakan", "Report Kematian", "Report Daily", "Master Periode"];
  var missing = requiredSheets.filter(function(n) { return sheetNames.indexOf(n) === -1; });
  if (missing.length > 0) setupDatabase();
}

function formatAllHeaders() {
  var doc = SpreadsheetApp.getActiveSpreadsheet();
  doc.getSheets().forEach(function(sheet) {
    var lastCol = sheet.getLastColumn();
    if (lastCol > 0) {
      sheet.getRange(1, 1, 1, lastCol).setBackground("#4CAF50").setFontColor("#FFFFFF").setFontWeight("bold").setHorizontalAlignment("center");
      sheet.setFrozenRows(1);
    }
  });
}

function ensureHeaderExists(sheet, sheetName) {
  var lastRow = sheet.getLastRow();
  if (lastRow === 0) { buatHeaderOtomatis(sheet, sheetName); return; }
}

function getExpectedHeader(sheetName) {
  if (sheetName === "Report Daily") return ["Timestamp", "ID Periode", "Tanggal", "Umur Hari", "Pakan Atas", "Pakan Bawah", "ABW 1", "Foto 1", "ABW 2", "Foto 2", "ABW 3", "Foto 3", "ABW 4", "Foto 4"];
  if (sheetName === "Report Pakan") return ["Timestamp", "ID Periode", "Tanggal", "Sumber", "PO", "Zak", "Kg", "Kendaraan", "Deskripsi", "Dokumentasi"];
  if (sheetName === "Report Kematian") {
    var h = ["Timestamp", "ID Periode", "Tanggal"];
    for (var i = 1; i <= 24; i++) h.push("Jam " + i);
    return h;
  }
  return [];
}

function buatHeaderOtomatis(s, n) {
  var header = getExpectedHeader(n);
  if (header.length > 0) s.appendRow(header);
}

function processPhotos(list, folderName) {
  if (!list || list.length === 0) return "Tidak ada dokumentasi";
  var urls = [];
  var folder = getOrCreateFolder(folderName);
  for (var i = 0; i < list.length; i++) {
    var blob = Utilities.newBlob(Utilities.base64Decode(list[i].data), list[i].mime, list[i].name);
    var file = folder.createFile(blob);
    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    urls.push(file.getUrl());
  }
  return urls.join(", ");
}

function getOrCreateFolder(n) { 
  var f = DriveApp.getFoldersByName(n); 
  return f.hasNext() ? f.next() : DriveApp.createFolder(n); 
}

function formatDate(d) {
  if (!d) return "";
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d)) return d.substring(0, 10);
  return Utilities.formatDate(new Date(d), Session.getScriptTimeZone(), "yyyy-MM-dd");
}

function sendTelegramMessageMarkdown(msg) {
  UrlFetchApp.fetch("https://api.telegram.org/bot" + TELEGRAM_BOT_TOKEN + "/sendMessage", {
    method: "post", contentType: "application/json", muteHttpExceptions: true,
    payload: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: "Markdown", disable_web_page_preview: true })
  });
}

function updateRekapLaporanFull() {
  var doc = SpreadsheetApp.getActiveSpreadsheet();
  var sDaily = doc.getSheetByName("Report Daily");
  var sMati = doc.getSheetByName("Report Kematian");
  var sRekap = doc.getSheetByName("Rekap Laporan Full") || doc.insertSheet("Rekap Laporan Full");
  if (!sDaily) return;
  
  sRekap.clear();
  var h = ["ID Periode", "Tanggal", "Umur Hari", "Pakan Atas", "Pakan Bawah", "ABW 1", "Foto 1", "ABW 2", "Foto 2", "ABW 3", "Foto 3", "ABW 4", "Foto 4"];
  for (var i = 1; i <= 24; i++) h.push("Jam " + i);
  h.push("Total Mati");
  
  var dData = sDaily.getDataRange().getValues();
  var mData = sMati ? sMati.getDataRange().getValues() : [];
  var batchData = [h];

  for (var i = 1; i < dData.length; i++) {
    var id_periode = dData[i][1];
    var tgl = formatDate(dData[i][2]);
    var row = [id_periode, tgl, dData[i][3], dData[i][4], dData[i][5], dData[i][6], dData[i][7], dData[i][8], dData[i][9], dData[i][10], dData[i][11], dData[i][12], dData[i][13]];
    var totalMati = 0;
    var jamData = Array(24).fill("");
    
    for (var j = 1; j < mData.length; j++) {
      if (formatDate(mData[j][2]) === tgl && mData[j][1] === id_periode) {
        for (var k = 0; k < 24; k++) {
          if (mData[j][k + 3]) {
            jamData[k] = mData[j][k + 3];
            var match = mData[j][k + 3].toString().match(/Mati:\s*(\d+)/);
            if (match) totalMati += parseInt(match[1]);
          }
        }
      }
    }
    batchData.push(row.concat(jamData).concat([totalMati]));
  }
  
  if (batchData.length > 0) sRekap.getRange(1, 1, batchData.length, batchData[0].length).setValues(batchData);
}

            html += `<div class="section-title">1. RINGKASAN OPERASIONAL HARIAN</div>`;
            html += `<div class="item">Usia Ayam : ${item.umur_hari} hari</div>`;
            html += `<div class="item">Pakan Atas : ${item.pakan_atas} karung</div>`;
            html += `<div class="item">Pakan Bawah : ${item.pakan_bawah} karung</div>`;
            html += `<div class="item">Timbangan ABW :</div>`;
            
            // Sekat 1-4 dengan foto
            const sekats = [
                { nama: 'Sekat 1', abw: item.abw_sekat1, foto: item.foto_sekat1 },
                { nama: 'Sekat 2', abw: item.abw_sekat2, foto: item.foto_sekat2 },
                { nama: 'Sekat 3', abw: item.abw_sekat3, foto: item.foto_sekat3 },
                { nama: 'Sekat 4', abw: item.abw_sekat4, foto: item.foto_sekat4 }
            ];
            
            sekats.forEach(s => {
                const fotoLinks = createFotoLinks(s.foto, 'Foto');
                html += `<div class="item" style="margin-left:20px;">- ${s.nama} : ${s.abw}g ${fotoLinks ? '— ' + fotoLinks : ''}</div>`;
            });
            
            html += `<div class="divider"></div>`;
            
            // 2. PEMASUKAN PAKAN
            html += `<div class="section-title">2. PEMASUKAN PAKAN</div>`;
            if (pakanItems.length > 0) {
                pakanItems.forEach(p => {
                    html += `<div class="item">• ${p.sumber_pakan} : ${p.jumlah_zak} Zak (${p.jumlah_kg} Kg)</div>`;
                    const fotoLinks = createFotoLinks(p.dokumentasi, 'Bukti');
                    if (fotoLinks) html += `<div class="item" style="margin-left:20px;">Dokumentasi : ${fotoLinks}</div>`;
                });
            } else {
                html += `<div class="item">• Tidak ada pakan masuk</div>`;
            }
            
            html += `<div class="divider"></div>`;
            
            // 3. KEMATIAN 24 JAM
            html += `<div class="section-title">3. KEMATIAN 24 JAM</div>`;
            if (item.jam) {
                const jamList = item.jam.split(';');
                jamList.forEach(j => {
                    html += `<div class="item">• ${j} ekor</div>`;
                });
            } else {
                html += `<div class="item">• Nihil</div>`;
            }
            
            html += `<div class="total">Total Kematian 24 Jam : ${item.jumlah_mati} ekor</div>`;
            
            // Rekap eviden
            if (fotoMati.length > 0) {
                html += `<div class="item">• Rekap Seluruh Eviden : ${fotoMati.map((u, i) => `Eviden ${i+1} (<a href="${u}" target="_blank">${u}</a>)`).join(' | ')}</div>`;
            }
            
            html += `</div>`;
        });
        
        content.innerHTML = html;
    }

    // TABLE DATA
    function displayTableData(data) {
        const content = document.getElementById('dashboardContent');
        let html = '';
        
        const dailyData = data.filter(item => item.sheet === 'Daily');
        if (dailyData.length > 0) {
            html += '<div class="card"><h2>Laporan Harian</h2><div style="overflow-x:auto;"><table>';
            html += '<thead><tr><th>Tanggal</th><th>Periode</th><th>Umur</th><th>ABW 1</th><th>Foto 1</th><th>ABW 2</th><th>Foto 2</th><th>ABW 3</th><th>Foto 3</th><th>ABW 4</th><th>Foto 4</th><th>Kematian</th></tr></thead><tbody>';
            dailyData.forEach(item => {
                html += `<tr><td>${item.tanggal}</td><td>${item.id_periode}</td><td>${item.umur_hari} hari</td>`;
                html += `<td>${item.abw_sekat1}g</td><td>${createFotoThumbnails(item.foto_sekat1)}</td>`;
                html += `<td>${item.abw_sekat2}g</td><td>${createFotoThumbnails(item.foto_sekat2)}</td>`;
                html += `<td>${item.abw_sekat3}g</td><td>${createFotoThumbnails(item.foto_sekat3)}</td>`;
                html += `<td>${item.abw_sekat4}g</td><td>${createFotoThumbnails(item.foto_sekat4)}</td>`;
                html += `<td style="color:#e74c3c;font-weight:600;">${item.jumlah_mati} ekor</td></tr>`;
            });
            html += '</tbody></table></div></div>';
        }
        
        const pakanData = data.filter(item => item.sheet === 'Pakan');
        if (pakanData.length > 0) {
            html += '<div class="card"><h2>Riwayat Pakan</h2><div style="overflow-x:auto;"><table>';
            html += '<thead><tr><th>Tanggal</th><th>Periode</th><th>Sumber</th><th>Zak</th><th>Kg</th><th>Dokumentasi</th></tr></thead><tbody>';
            pakanData.forEach(item => {
                html += `<tr><td>${item.tanggal}</td><td>${item.id_periode}</td><td>${item.sumber_pakan}</td><td>${item.jumlah_zak}</td><td>${item.jumlah_kg}</td><td>${createFotoThumbnails(item.dokumentasi)}</td></tr>`;
            });
            html += '</tbody></table></div></div>';
        }
        
        content.innerHTML = html || '<div style="text-align:center;padding:40px;color:#7f8c8d;">Belum ada data.</div>';
    }

    // INIT
    document.addEventListener('DOMContentLoaded', checkSession);
    setInterval(() => { if (document.getElementById('dashboardPage').style.display === 'block') loadDashboard(); }, 300000);
</script>
</body>
</html>
