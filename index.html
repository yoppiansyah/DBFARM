<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nadia Nurhaliza Farm's - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #5b21b6;
            --secondary: #8b5cf6;
            --bg-color: #f5f3ff;
            --card-bg: #ffffff;
            --text-main: #1e1b4b;
            --text-muted: #64748b;
            --border: #ede9fe;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            --radius-lg: clamp(16px, 2vw, 24px);
            --radius-md: clamp(12px, 1.5vw, 16px);
            --radius-sm: 12px;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.03);
            --shadow-lg: 0 15px 30px rgba(109, 40, 217, 0.15);

            --fs-xs: clamp(10px, 0.8vw, 11px);
            --fs-sm: clamp(12px, 1vw, 13px);
            --fs-base: clamp(14px, 1.2vw, 15px);
            --fs-md: clamp(16px, 1.5vw, 18px);
            --fs-lg: clamp(20px, 2.5vw, 24px);
            --fs-xl: clamp(24px, 3vw, 32px);

            --space-sm: clamp(8px, 1vw, 12px);
            --space-md: clamp(16px, 2vw, 24px);
            --space-lg: clamp(24px, 3vw, 32px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f1f5f9;
                --text-muted: #94a3b8;
                --border: #334155;
            }
            .input-group input, .filter-search-box select, .filter-search-box input[type="date"], .filter-search-box input[type="text"] { 
                background: #334155 !important; 
                color: white !important; 
                border-color: #475569 !important; 
            }
            th { background: #334155 !important; color: #e2e8f0 !important; }
            tr:hover td { background: #334155 !important; }
            td { border-bottom: 1px solid #334155 !important; }
            .slider-item { background: #334155 !important; }
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            font-size: var(--fs-base);
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }
        img { max-width: 100%; height: auto; }

        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-md);
        }
        .login-container { 
            width: 100%; 
            max-width: 420px; 
            background: var(--card-bg); 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-lg); 
            overflow: hidden; 
            border: 1px solid var(--border); 
            animation: slideUp 0.5s ease; 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .login-header { 
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-dark) 100%); 
            color: white; 
            padding: var(--space-lg); 
            text-align: center; 
            position: relative; 
            overflow: hidden; 
        }
        .login-header h1 { font-size: var(--fs-xl); font-weight: 800; margin-bottom: 5px; position: relative; z-index: 1; }
        .login-header p { font-size: var(--fs-sm); opacity: 0.9; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; position: relative; z-index: 1; }
        .login-body { padding: var(--space-lg); }
        
        .form-group { margin-bottom: var(--space-md); width: 100%; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: var(--fs-sm); color: var(--primary); text-transform: uppercase; }
        
        .input-group { position: relative; width: 100%; }
        .input-group .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--secondary); z-index: 2; }
        .input-group input { 
            width: 100%; 
            padding: 14px 16px 14px 48px;
            border: 2px solid var(--border); 
            border-radius: var(--radius-sm); 
            font-size: var(--fs-base); 
            background: rgba(124, 58, 237, 0.03); 
            color: var(--text-main); 
            transition: all 0.2s; 
            font-family: inherit; 
        }
        .input-group input:focus { outline: none; border-color: var(--primary); background: var(--card-bg); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1); }
        .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: var(--fs-xs); color: var(--primary); font-weight: 700; padding: 10px; }
        
        .btn-main { 
            width: 100%; 
            padding: 16px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-dark) 100%); 
            color: white; 
            border: none; 
            border-radius: var(--radius-sm); 
            font-size: var(--fs-md); 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }
        .btn-main:active { transform: scale(0.98); }

        .alert { padding: 12px; border-radius: var(--radius-sm); margin-bottom: var(--space-md); display: none; font-size: var(--fs-sm); font-weight: 600; text-align: center; }
        .alert.show { display: block; animation: shake 0.4s; }
        .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .app {
            display: none;
            width: 100%;
            min-height: 100vh;
            position: relative;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.show { opacity: 1; visibility: visible; }
        
        .sidebar-header {
            padding: 24px var(--space-md);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: var(--fs-md);
            font-weight: 800;
            color: var(--primary);
        }
        .sidebar-header i { font-size: 28px; }
        .sidebar-nav {
            padding: var(--space-md) 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }
        .nav-link {
            padding: 14px var(--space-md);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: var(--fs-base);
            transition: 0.2s;
            border-left: 4px solid transparent;
        }
        .nav-link i { font-size: 22px; }
        .nav-link:hover, .nav-link.active {
            background: rgba(124, 58, 237, 0.05);
            color: var(--primary);
            border-left-color: var(--primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            width: 100%;
            transition: margin-left 0.3s ease;
        }

        .topbar {
            background: var(--card-bg);
            padding: 12px var(--space-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 900;
            gap: 16px;
        }
        .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }
        .btn-menu {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            display: flex;
        }
        .brand-mobile { font-weight: 700; font-size: var(--fs-md); color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px 6px 6px;
            background: var(--bg-color);
            border-radius: 50px;
            border: 1px solid var(--border);
        }
        .avatar {
            width: 32px; height: 32px;
            background: var(--primary); color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .username-text { font-size: var(--fs-sm); font-weight: 600; display: none; }

        .content {
            padding: var(--space-md);
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .status-bar {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: var(--space-md);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-md);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: var(--shadow-md);
        }
        .status-left { display: flex; align-items: center; gap: clamp(12px, 2vw, 24px); flex-wrap: wrap; font-size: var(--fs-sm); font-weight: 600; }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
        .status-dot.online { background: #34d399; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.2); }
        .status-dot.offline { background: #f87171; }
        .status-dot.checking { background: #fbbf24; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        
        .btn-support {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: var(--fs-sm);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .btn-support:hover { background: rgba(255,255,255,0.3); }

        .controls-area {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }
        
        .btn-refresh {
            background: var(--card-bg);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: var(--fs-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }
        .btn-refresh.spinning i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .filter-search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .filter-search-box select, .filter-search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-color);
            font-size: var(--fs-base);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }
        .search-wrapper { position: relative; width: 100%; }
        .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; }
        .search-wrapper input { padding-left: 40px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }
        .stat-card {
            background: var(--card-bg);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-label { font-size: var(--fs-xs); color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .stat-label i { font-size: 16px; }
        .stat-value { font-size: var(--fs-lg); font-weight: 800; line-height: 1.2; }
        .stat-sub { font-size: var(--fs-xs); color: var(--text-muted); font-weight: 600; margin-top: 4px; }

        .comparison {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .comparison .badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 700;
            white-space: nowrap;
        }
        .comparison .better { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .comparison .worse { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .comparison .same { background: rgba(100, 116, 139, 0.2); color: var(--text-muted); }

        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: var(--card-bg); padding: var(--space-md); border-radius: var(--radius-lg); margin-bottom: var(--space-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); flex-wrap: wrap; gap: 10px; }
        .card h2 { font-size: var(--fs-md); font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .card-badge { font-size: var(--fs-xs); background: rgba(124, 58, 237, 0.1); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-weight: 700; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: var(--fs-base); }
        th { background: #f8fafc; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: var(--fs-xs); letter-spacing: 0.5px; padding: 14px 16px; text-align: left; border-bottom: 2px solid var(--border); white-space: nowrap; }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .badge-periode { background: #f3e8ff; color: #6d28d9; padding: 4px 12px; border-radius: 6px; font-size: var(--fs-xs); font-weight: 700; display: inline-block; }

        .slider-track { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; max-width: 200px; }
        .slider-track::-webkit-scrollbar { display: none; }
        .slider-item { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; flex-shrink: 0; background: #f1f5f9; display: flex; align-items: center; justify-content: center; position: relative; }
        .slider-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .slider-item .photo-count { position: absolute; bottom: 2px; right: 2px; background: rgba(0,0,0,0.7); color: white; font-size: 9px; padding: 2px 5px; border-radius: 10px; font-weight: 700; }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 2000;
            justify-content: center; align-items: center; cursor: zoom-out; padding: var(--space-md);
            backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s;
        }
        .modal.active { display: flex; opacity: 1; }
        .modal-content {
            width: min(95vw, 800px);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            object-fit: contain;
            transform: scale(0.9); transition: transform 0.3s;
        }
        .modal.active .modal-content img { transform: scale(1); }
        .modal-close { position: absolute; top: -10px; right: 0; color: white; font-size: 32px; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); border-radius: 50%; z-index: 2001; }

        .loading-state, .empty-state { text-align: center; padding: 40px var(--space-md); color: var(--text-muted); }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.3; display: block; }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }

        @media (min-width: 768px) {
            .controls-area { grid-template-columns: auto 1fr; align-items: center; }
            .filter-search-box { flex-direction: row; align-items: center; }
            .filter-search-box select, .filter-search-box input { border: none; border-right: 1px solid var(--border); border-radius: 0; width: auto; flex: 1; }
            .filter-search-box > *:last-child { border-right: none; }
            .btn-refresh { padding: 12px 20px; }
            .username-text { display: inline; }
        }

        @media (min-width: 992px) {
            .btn-menu { display: none; }
            .brand-mobile { display: none; }
            .sidebar { transform: translateX(0); position: sticky; }
            .sidebar-overlay { display: none !important; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="login-page" id="loginPage">
    <div class="login-container">
        <div class="login-header">
            <h1>Nadia Farm's</h1>
            <p>Smart Poultry Manager</p>
        </div>
        <div class="login-body">
            <div id="alert" class="alert"></div>
            <form onsubmit="handleLogin(event)" autocomplete="off">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-group">
                        <span class="icon"><i class="ph ph-user"></i></span>
                        <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <span class="icon"><i class="ph ph-lock-key"></i></span>
                        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="off">
                        <span class="password-toggle" onclick="togglePassword()">LIHAT</span>
                    </div>
                </div>
                <button type="submit" class="btn-main"><i class="ph ph-sign-in"></i> Masuk Dashboard</button>
            </form>
        </div>
    </div>
</div>

<div class="app" id="dashboardPage">
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="ph ph-plant"></i> Nadia Farm's
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-link active" onclick="switchTab('pakan', this)"><i class="ph ph-bowl-food"></i> Riwayat Pakan</a>
            <a href="#" class="nav-link" onclick="switchTab('daily', this)"><i class="ph ph-chart-bar"></i> Laporan Harian</a>
        </nav>
        <div style="padding: var(--space-md); border-top: 1px solid var(--border);">
            <a href="#" class="nav-link" style="color: var(--danger);" onclick="logout()"><i class="ph ph-sign-out"></i> Keluar</a>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
        
        <header class="topbar">
            <div class="topbar-left">
                <button class="btn-menu" onclick="toggleSidebar()"><i class="ph ph-list"></i></button>
                <div class="brand-mobile"><i class="ph ph-plant"></i> Nadia Farm's</div>
            </div>
            <div class="topbar-right">
                <div class="user-profile">
                    <div class="avatar"><i class="ph ph-user"></i></div>
                    <span class="username-text" id="displayUsername">Admin</span>
                </div>
            </div>
        </header>

        <section class="content">
            
            <div class="status-bar">
                <div class="status-left">
                    <div class="status-item">
                        <span class="status-dot checking" id="statusDot"></span>
                        <span id="statusText">Memeriksa...</span>
                    </div>
                    <div class="status-item">
                        <i class="ph ph-calendar"></i>
                        <span id="liveClock">-</span>
                    </div>
                </div>
                <a class="btn-support" id="waSupport" href="#" target="_blank" rel="noopener">
                    <i class="ph ph-whatsapp-logo"></i> Hubungi Dukungan
                </a>
            </div>

            <div class="controls-area">
                <button class="btn-refresh" id="refreshBtn" onclick="loadDashboard()">
                    <i class="ph ph-arrows-clockwise"></i> <span class="hide-mobile">Refresh</span>
                </button>
                
                <div class="filter-search-box">
                    <select id="filterPeriode" onchange="handlePeriodeChange()">
                        <option value="">-- Semua Periode --</option>
                    </select>

                    <select id="filterWaktu" onchange="handleWaktuChange()" style="display: none;">
                        <option value="semua">Semua Waktu</option>
                        <option value="hari_ini">Hari Ini</option>
                        <option value="bulan_ini">Bulan Ini</option>
                        <option value="tahun_ini">Tahun Ini</option>
                        <option value="custom">Pilih Tanggal...</option>
                    </select>

                    <input type="date" id="filterTanggal" style="display: none;" onchange="filterTable()">
                    
                    <div class="search-wrapper">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="globalSearch" placeholder="Cari data..." oninput="filterTable()">
                    </div>
                </div>
            </div>

            <div class="stats-grid" id="statsContainer"></div>

    // --- FUNGSI KONVERSI URL GOOGLE DRIVE (DIPERBAIKI) ---
    function extractDriveFileId(url) {
        if (!url || typeof url !== 'string') return null;
        
        // Bersihkan URL
        url = url.trim();
        
        // Format 1: https://drive.google.com/file/d/FILE_ID/view?usp=sharing
        let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (match) return match[1];
        
        // Format 2: https://drive.google.com/open?id=FILE_ID
        match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match) return match[1];
        
        // Format 3: https://drive.google.com/d/FILE_ID/view
        match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match) return match[1];
        
        // Format 4: https://drive.google.com/uc?id=FILE_ID
        match = url.match(/uc\?id=([a-zA-Z0-9_-]+)/);
        if (match) return match[1];
        
        // Format 5: https://drive.google.com/thumbnail?id=FILE_ID
        match = url.match(/thumbnail\?id=([a-zA-Z0-9_-]+)/);
        if (match) return match[1];
        
        // Format 6: https://drive.google.com/uc?export=view&id=FILE_ID
        match = url.match(/export=view&id=([a-zA-Z0-9_-]+)/);
        if (match) return match[1];
        
        // Format 7: ID langsung (jika URL adalah ID murni)
        if (url.match(/^[a-zA-Z0-9_-]{20,}$/)) return url;
        
        return null;
    }

    function convertToThumbnail(url) {
        const fileId = extractDriveFileId(url);
        if (fileId) {
            return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w500';
        }
        return url;
    }

    function convertToFullImage(url) {
        const fileId = extractDriveFileId(url);
        if (fileId) {
            return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1920';
        }
        return url;
    }

    // Fungsi untuk memisahkan multiple URL foto
    function extractPhotoUrls(str) {
        if (!str || typeof str !== 'string') return [];
        
        // Coba berbagai separator
        let urls = [];
        
        // Split by common separators
        const parts = str.split(/[,\n;|]/);
        
        parts.forEach(part => {
            part = part.trim();
            
            // Cari URL Google Drive dalam teks
            const driveMatch = part.match(/https?:\/\/drive\.google\.com\/[^\s"'<>]+/g);
            if (driveMatch) {
                urls = urls.concat(driveMatch);
            } else if (part.startsWith('http') || part.includes('drive.google.com')) {
                urls.push(part);
            } else if (extractDriveFileId(part)) {
                urls.push(part);
            }
        });
        
        // Filter dan deduplicate
        urls = urls.filter(url => url && url.length > 10);
        urls = [...new Set(urls)];
        
        return urls;
    }

    function parseKgDashboard(kgValue) {

    function parseABW(value) {
        if (!value || value === "" || value === "0" || value === 0) return 0;
        let num = parseFloat(value);
        if (isNaN(num)) return 0;
        if (num > 1000) {
            num = num / 1000;
            if (num > 20) {
                num = num / 10;
            }
        }
        if (num > 100 || num < 0) return 0;
        return num;
    }

    // --- FUNGSI PERHITUNGAN FCR & IP ---
    function getStandardForUmur(umur) {
        let closest = STANDARD_DATA[0];
        for (let i = 0; i < STANDARD_DATA.length; i++) {
            if (STANDARD_DATA[i].umur <= umur) {
                closest = STANDARD_DATA[i];
            } else {
                break;
            }
        }
        return closest;
    }

    function calculateAverageABW() {
        const abwData = [];
        
        globalDailyData.forEach(item => {
            const abw1 = parseABW(item.abw_sekat1);
            const abw2 = parseABW(item.abw_sekat2);
            const abw3 = parseABW(item.abw_sekat3);
            const abw4 = parseABW(item.abw_sekat4);
            
            const validABW = [abw1, abw2, abw3, abw4].filter(val => val > 0);
            
            if (validABW.length > 0) {
                const avgPerSekat = validABW.reduce((sum, val) => sum + val, 0) / validABW.length;
                const abwPerEkorGram = (avgPerSekat / AYAM_PER_SEKAT) * 1000;
                
                abwData.push({
                    tanggal: item.tanggal,
                    usia: parseInt(item.usia || item.umur_hari) || 0,
                    abwPerEkor: abwPerEkorGram,
                    beratTotalPerSekat: avgPerSekat,
                    jumlahSekat: validABW.length
                });
            }
        });
        
        return abwData;
    }

    function getLatestABW() {
        const abwData = calculateAverageABW();
        if (abwData.length === 0) return null;
        abwData.sort((a, b) => b.usia - a.usia);
        return abwData[0];
    }

    function calculatePerformanceMetrics() {
        const selectedPeriode = document.getElementById('filterPeriode').value;
        if (!selectedPeriode) {
            return { fcrAktual: null, ipAktual: null, fcrStd: null, ipStd: null, umur: null, abwAktual: null, abwStd: null };
        }

        const periodeInfo = globalPeriodeList.find(p => p.id_periode === selectedPeriode);
        if (!periodeInfo || !periodeInfo.populasi) return null;

        const populasiAwal = parseInt(periodeInfo.populasi.jumlah_awal) || 0;
        const totalMati = parseInt(periodeInfo.populasi.total_mati) || 0;
        const populasiSekarang = parseInt(periodeInfo.populasi.populasi_sekarang) || 0;

        const totalPakanKg = globalPakanData.reduce((acc, curr) => acc + parseKgDashboard(curr.jumlah_kg), 0);

        const latestABWData = getLatestABW();
        let umur = 0;
        let abwAktual = 0;

        if (latestABWData) {
            umur = latestABWData.usia;
            abwAktual = latestABWData.abwPerEkor;
        } else {
            if (globalDailyData.length > 0) {
                const usiaValues = globalDailyData
                    .map(item => parseInt(item.usia || item.umur_hari) || 0)
                    .filter(usia => usia > 0);
                if (usiaValues.length > 0) {
                    umur = Math.max(...usiaValues);
                }
            }
            
            if (umur === 0 && populasiAwal > 0) {
                const tglMulai = periodeInfo.populasi.tanggal_mulai;
                if (tglMulai) {
                    const startDate = new Date(tglMulai);
                    const today = new Date();
                    umur = Math.max(0, Math.floor((today - startDate) / (1000 * 60 * 60 * 24)));
                }
            }
            
            if (umur > 0) {
                const stdData = getStandardForUmur(umur);
                abwAktual = stdData ? stdData.bb : 0;
            }
        }

        const stdData = getStandardForUmur(umur);
        const fcrStd = stdData ? stdData.fcr : null;
        const ipStd = stdData ? stdData.ip : null;
        const abwStd = stdData ? stdData.bb : null;

        let fcrAktual = null;
        if (totalPakanKg > 0 && populasiSekarang > 0 && abwAktual > 0) {
            const totalBeratKg = (populasiSekarang * abwAktual) / 1000;
            fcrAktual = totalPakanKg / totalBeratKg;
        }

        let ipAktual = null;
        if (fcrAktual && umur > 0 && populasiAwal > 0) {
            const survivalRate = (populasiSekarang / populasiAwal) * 100;
            const beratKg = abwAktual / 1000;
            ipAktual = (beratKg * survivalRate * 100) / (umur * fcrAktual);
        }

        return { 
            fcrAktual, ipAktual, fcrStd, ipStd, umur, abwAktual, abwStd,
            totalPakanKg, populasiAwal, populasiSekarang, totalMati,
            survivalRate: populasiAwal > 0 ? (populasiSekarang / populasiAwal) * 100 : 0,
            jumlahDataABW: latestABWData ? latestABWData.jumlahSekat : 0
        };
    }

    // --- FUNGSI RENDER DASHBOARD ---
    function renderStats() {
        const totalKg = globalPakanData.reduce((acc, curr) => acc + parseKgDashboard(curr.jumlah_kg), 0);
        let totalMati = 0, populasiAwal = 0, populasiSekarang = 0, mortalitas = 0;
        const selectedPeriode = document.getElementById('filterPeriode').value;
        
        if (selectedPeriode) {
            const periodeData = globalPeriodeList.find(p => p.id_periode === selectedPeriode);
            if (periodeData && periodeData.populasi) {
                totalMati = parseInt(periodeData.populasi.total_mati) || 0;
                populasiAwal = parseInt(periodeData.populasi.jumlah_awal) || 0;
                populasiSekarang = parseInt(periodeData.populasi.populasi_sekarang) || 0;
                mortalitas = periodeData.populasi.persentase_mati || 0;
            }
        } else {
            globalPeriodeList.forEach(p => { if (p.populasi) totalMati += parseInt(p.populasi.total_mati) || 0; });
        }

        let statsHTML = `
            <div class="stat-card">
                <div class="stat-label"><i class="ph ph-scales"></i> Total Pakan Masuk</div>
                <div class="stat-value" style="color: var(--primary);">${totalKg.toLocaleString('id-ID')} Kg</div>
                <div class="stat-sub">Akumulasi periode terpilih</div>
            </div>`;

        if (selectedPeriode && globalPakanInfo) {
            statsHTML += `
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-package"></i> Total Pakan Tersisa</div>
                    <div class="stat-value" style="color: var(--info);">${globalPakanInfo.sisa_zak} Zak</div>
                    <div class="stat-sub">${globalPakanInfo.sisa_kg.toLocaleString('id-ID')} Kg</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-check-circle"></i> Total Pakan Terpakai</div>
                    <div class="stat-value" style="color: var(--warning);">${globalPakanInfo.total_terpakai_zak} Zak</div>
                    <div class="stat-sub">${globalPakanInfo.total_terpakai_kg.toLocaleString('id-ID')} Kg</div>
                </div>`;
        }

        statsHTML += `
            <div class="stat-card">
                <div class="stat-label"><i class="ph ph-warning-circle"></i> Total Kematian</div>
                <div class="stat-value" style="color: var(--danger);">${totalMati.toLocaleString('id-ID')} Ekor</div>
                <div class="stat-sub">Akumulasi periode terpilih</div>
            </div>`;

        if (selectedPeriode && populasiAwal > 0) {
            statsHTML += `
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-bird"></i> Populasi Awal</div>
                    <div class="stat-value">${populasiAwal.toLocaleString('id-ID')}</div>
                    <div class="stat-sub">Ekor</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label"><i class="ph ph-trend-up"></i> Populasi Saat Ini</div>
                    <div class="stat-value" style="color: var(--success);">${populasiSekarang.toLocaleString('id-ID')}</div>
                    <div class="stat-sub">Ekor (Mortalitas: ${mortalitas}%)</div>
                </div>`;
        }

        const metrics = calculatePerformanceMetrics();
        if (metrics && metrics.umur > 0) {
            let fcrComparison = '';
            let ipComparison = '';

            if (metrics.fcrAktual && metrics.fcrStd) {
                const diff = metrics.fcrAktual - metrics.fcrStd;
                if (diff < 0) fcrComparison = `<span class="badge better"><i class="ph ph-arrow-down"></i> Lebih Baik</span>`;
                else if (diff > 0) fcrComparison = `<span class="badge worse"><i class="ph ph-arrow-up"></i> Lebih Buruk</span>`;
                else fcrComparison = `<span class="badge same"><i class="ph ph-equals"></i> Sama</span>`;
            }

            if (metrics.ipAktual && metrics.ipStd) {
                const diff = metrics.ipAktual - metrics.ipStd;
                if (diff > 0) ipComparison = `<span class="badge better"><i class="ph ph-arrow-up"></i> Lebih Baik</span>`;
                else if (diff < 0) ipComparison = `<span class="badge worse"><i class="ph ph-arrow-down"></i> Lebih Buruk</span>`;
                else ipComparison = `<span class="badge same"><i class="ph ph-equals"></i> Sama</span>`;
            }

            statsHTML += `
                <div class="stat-card" style="grid-column: span 1;">
                    <div class="stat-label"><i class="ph ph-calculator"></i> FCR (Usia ${metrics.umur} Hari)</div>
                    <div class="stat-value" style="color: ${metrics.fcrAktual > metrics.fcrStd ? 'var(--danger)' : 'var(--success)'};">
                        ${metrics.fcrAktual ? metrics.fcrAktual.toFixed(3) : '-'}
                    </div>
                    <div class="stat-sub">
                        Standar: ${metrics.fcrStd ? metrics.fcrStd.toFixed(3) : '-'}
                        ${fcrComparison}
                    </div>
                </div>
                <div class="stat-card" style="grid-column: span 1;">
                    <div class="stat-label"><i class="ph ph-gauge"></i> IP (Usia ${metrics.umur} Hari)</div>
                    <div class="stat-value" style="color: ${metrics.ipAktual > metrics.ipStd ? 'var(--success)' : 'var(--danger)'};">
                        ${metrics.ipAktual ? metrics.ipAktual.toFixed(1) : '-'}
                    </div>
                    <div class="stat-sub">
                        Standar: ${metrics.ipStd ? metrics.ipStd : '-'}
                        ${ipComparison}
                    </div>
                </div>
                <div class="stat-card" style="grid-column: span 1;">
                    <div class="stat-label"><i class="ph ph-scale"></i> ABW Aktual vs Standar</div>
                    <div class="stat-value">${metrics.abwAktual ? metrics.abwAktual.toFixed(0) : '-'} g</div>
                    <div class="stat-sub">
                        Standar: ${metrics.abwStd ? metrics.abwStd : '-'} g
                        ${metrics.abwAktual >= metrics.abwStd ? '<span class="badge better"><i class="ph ph-arrow-up"></i> Lebih Baik</span>' : '<span class="badge worse"><i class="ph ph-arrow-down"></i> Lebih Buruk</span>'}
                    </div>
                </div>
                <div class="stat-card" style="grid-column: span 1;">
                    <div class="stat-label"><i class="ph ph-heartbeat"></i> Daya Hidup</div>
                    <div class="stat-value" style="color: ${metrics.survivalRate > 95 ? 'var(--success)' : metrics.survivalRate > 90 ? 'var(--warning)' : 'var(--danger)'};">
                        ${metrics.survivalRate ? metrics.survivalRate.toFixed(1) : '-'}%
                    </div>
                    <div class="stat-sub">Standar: >95%</div>
                </div>`;
        }

        document.getElementById('statsContainer').innerHTML = statsHTML;
    }

    function filterTable() {
        const query = document.getElementById('globalSearch').value.toLowerCase().trim();
        const waktu = document.getElementById('filterWaktu').value;
        const tanggalCustom = document.getElementById('filterTanggal').value;
        const selectedPeriode = document.getElementById('filterPeriode').value;
        
        const today = new Date();
        const curYearStr = String(today.getFullYear());
        const curMonthStr = String(today.getMonth() + 1).padStart(2, '0');
        const curDayStr = String(today.getDate()).padStart(2, '0');
        
        const todayStr = `${curYearStr}-${curMonthStr}-${curDayStr}`;
        const thisMonthStr = `${curYearStr}-${curMonthStr}`;

        const isDateMatch = (itemDateStr) => {
            if (waktu === 'semua' || selectedPeriode === "") return true;
            if (!itemDateStr) return false;
            
            if (waktu === 'hari_ini') return itemDateStr === todayStr;
            if (waktu === 'bulan_ini') return itemDateStr.startsWith(thisMonthStr);
            if (waktu === 'tahun_ini') return itemDateStr.startsWith(curYearStr);
            if (waktu === 'custom' && tanggalCustom) return itemDateStr === tanggalCustom;
            return true;
        };

        const fPakan = globalPakanData.filter(item => isDateMatch(item.tanggal) && Object.values(item).some(val => String(val).toLowerCase().includes(query)));
        const fDaily = globalDailyData.filter(item => isDateMatch(item.tanggal) && Object.values(item).some(val => String(val).toLowerCase().includes(query)));

        renderPakanTable(fPakan);
        renderDailyTable(fDaily);

        document.getElementById('pakanCount').textContent = fPakan.length + ' Data';
        document.getElementById('dailyCount').textContent = fDaily.length + ' Data';
    }

    function renderPakanTable(data) {
        const container = document.getElementById('pakanContent');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="ph ph-tray"></i><p>Tidak ada data ditemukan</p></div>'; return;
        }

        let html = `<div class="table-responsive"><table><thead><tr>
            <th>Tanggal</th><th>Periode</th><th>Sumber</th><th>PO</th><th>Zak</th><th>Kg</th><th>Kendaraan</th><th>Dokumentasi</th>
        </tr></thead><tbody>`;
        data.forEach(item => {
            const kg = parseKgDashboard(item.jumlah_kg);
            html += `<tr>
                <td><strong>${item.tanggal || '-'}</strong></td>
                <td><span class="badge-periode">${item.id_periode || '-'}</span></td>
                <td>${item.sumber_pakan || '-'}</td>
                <td>${item.no_po || '-'}</td>
                <td>${item.jumlah_zak || '0'}</td>
                <td style="font-weight:700; color:var(--primary);">${kg.toLocaleString('id-ID')} Kg</td>
                <td>${item.kendaraan || '-'}</td>
                <td>${createFotoSlider(item.dokumentasi)}</td>
            </tr>`;
        });
        container.innerHTML = html + '</tbody></table></div>';
    }

    function renderDailyTable(data) {
        const container = document.getElementById('dailyContent');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="ph ph-clipboard-text"></i><p>Tidak ada data ditemukan</p></div>'; return;
        }

        let html = `<div class="table-responsive"><table><thead><tr>
            <th>Tanggal</th><th>Usia</th><th>ABW 1 (10ekr)</th><th>Foto</th><th>ABW 2 (10ekr)</th><th>Foto</th>
            <th>ABW 3 (10ekr)</th><th>Foto</th><th>ABW 4 (10ekr)</th><th>Foto</th><th>Mati</th><th>Foto Kematian</th>
        </tr></thead><tbody>`;
        data.forEach(item => {
            const mati = parseInt(item.jumlah_mati) || 0;
            const usia = item.usia || item.umur_hari || '0';
            html += `<tr>
                <td><strong>${item.tanggal || '-'}</strong></td>
                <td>${usia} Hari</td>
                <td>${formatABW(item.abw_sekat1)}</td><td>${createFotoSlider(item.foto_sekat1)}</td>
                <td>${formatABW(item.abw_sekat2)}</td><td>${createFotoSlider(item.foto_sekat2)}</td>
                <td>${formatABW(item.abw_sekat3)}</td><td>${createFotoSlider(item.foto_sekat3)}</td>
                <td>${formatABW(item.abw_sekat4)}</td><td>${createFotoSlider(item.foto_sekat4)}</td>
                <td style="color:${mati > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">${mati}</td>
                <td>${createFotoSlider(item.foto_kematian)}</td>
            </tr>`;
        });
        container.innerHTML = html + '</tbody></table></div>';
    }

    function formatABW(value) {
        if (!value || value === "" || value === "0" || value === 0) return "-";
        if (typeof value === 'string' && value.match(/^\d{2}\/\d{2}\/\d{4}$/)) return "-";
        return value + " kg";
    }

    // --- FUNGSI FOTO SLIDER (DIPERBAIKI) ---
    function createFotoSlider(str) {
        if (!str || typeof str !== 'string' || str.includes("Tidak ada") || str === "-" || str === "") {
            return '<span style="color:var(--text-muted);font-size:12px;">-</span>';
        }
        
        // Ekstrak semua URL foto
        const urls = extractPhotoUrls(str);
        
        if (urls.length === 0) {
            return '<span style="color:var(--text-muted);font-size:12px;">-</span>';
        }
        
        // Konversi semua URL ke thumbnail
        const convertedUrls = urls.map(url => convertToThumbnail(url));
        
        // Tampilkan slider dengan semua foto
        let html = `<div class="slider-track">`;
        convertedUrls.forEach((url, index) => {
            html += `
            <div class="slider-item" onclick="openModal('${url}')" title="Foto ${index + 1}">
                <img src="${url}" loading="lazy" alt="Foto ${index + 1}" onerror="this.parentElement.innerHTML='<i class=\\'ph ph-image\\' style=\\'font-size:20px;color:var(--text-muted);\\'></i>'">
                ${convertedUrls.length > 1 ? `<span class="photo-count">${index + 1}/${convertedUrls.length}</span>` : ''}
            </div>`;
        });
        html += `</div>`;
        
        return html;
    }

    // --- INISIALISASI ---
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); document.querySelector('.btn-main').click(); }
        });
        checkSession();
    });

    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'r') {
            e.preventDefault();
            if (document.getElementById('dashboardPage').style.display !== 'none') loadDashboard();
        }
    });
</script>
